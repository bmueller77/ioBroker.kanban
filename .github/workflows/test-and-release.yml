name: Test and Release

# Läuft bei jedem Push und Pull Request sowie bei Tags mit einer Versionsnummer.
# Der Tag-Trigger ist Vorgabe des ioBroker-Repository-Checkers (E3008); er wird
# gebraucht, sobald der deploy-Job dazukommt.
on:
  push:
    branches:
      - 'main'
    tags:
      # normale Versionen
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Vorabversionen
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}

# Ältere Läufe desselben Zweigs abbrechen, wenn ein neuer Commit kommt
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Schnelle Prüfungen vor den teuren Testläufen: Paketstruktur und Lint
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v1
        with:
          # Der Adapter verlangt Node 22, die Vorlage prüft mit 20
          node-version: '22.x'
          lint: true

  # Adaptertests auf allen unterstützten Node-Versionen und Systemen
  adapter-tests:
    # Erst prüfen, dann die teure Matrix starten (E3014)
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  # Veröffentlicht auf npm, sobald ein Commit mit einem v*-Tag versehen wird,
  # und legt dabei das GitHub-Release an.
  #
  # ACHTUNG: Ohne npm-token läuft die Anmeldung über Trusted Publishing. Das
  # muss auf npmjs.com für dieses Paket eingerichtet sein (Package settings ->
  # Trusted publisher: Repository bmueller77/ioBroker.kanban, Workflow
  # test-and-release.yml). Fehlt das, schlägt der Job beim nächsten Tag fehl.
  # Dafür wird die Veröffentlichung signiert (Provenance), was der
  # Repository-Checker unter E2008 verlangt.
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Nur bei einem Tag, der mit v beginnt
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # id-token für Trusted Publishing, contents für das GitHub-Release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          # Der Prüfer verlangt hier mindestens 24 (E3022). Betrifft nur die
          # Veröffentlichung, nicht die Laufzeit des Adapters.
          node-version: '24.x'
          github-token: ${{ secrets.GITHUB_TOKEN }}
